name: eval-gate

on:
  push:
    paths:
      - "prototype/**"
      - "data/samples/sky-samples/**"
      - "data/catalogs/**"
      - "data/input/smartphone/**"
      - ".github/workflows/eval-gate.yml"
  pull_request:
    paths:
      - "prototype/**"
      - "data/samples/sky-samples/**"
      - "data/catalogs/**"
      - "data/input/smartphone/**"
      - ".github/workflows/eval-gate.yml"

jobs:
  gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      # Generated tetra3 pattern databases are deterministic for a given
      # catalog + generation parameters (both hashed into the key). The blind
      # dense-band ladder can build up to three bands on a failing frame —
      # cached, that cost is paid once per parameter change, not per CI run.
      - name: Cache solver pattern databases
        uses: actions/cache@v4
        with:
          path: prototype/artifacts/cache
          key: tetra3-dbs-${{ hashFiles('data/catalogs/hyg_v42.csv.gz', 'prototype/crates/starglyph-core/src/engine.rs') }}
      - name: Install Pillow
        run: pip install pillow
      - name: Fetch CI sample frames
        working-directory: data/samples/sky-samples
        run: python3 fetch_sample.py tetra3_alt40 tetra3_alt60
      - name: Run eval gate
        run: make eval-gate

  smartphone:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: prototype/artifacts/cache
          key: tetra3-smartphone-dbs-${{ hashFiles('data/catalogs/hyg_v42.csv.gz', 'prototype/crates/starglyph-core/src/engine.rs', 'prototype/crates/starglyph-core/src/solve.rs', 'prototype/eval/baseline-smartphone.json', 'prototype/Cargo.lock') }}
      - name: Test smartphone gate
        run: python3 -m unittest discover -s eval -p 'test_smartphone_gate.py'
      - name: Evaluate all smartphone frames
        run: make eval-smartphone-gate
      - name: Preserve diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smartphone-eval
          path: prototype/artifacts/eval/smartphone/
          if-no-files-found: warn

  smartphone-sky-fill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: prototype/artifacts/cache
          key: tetra3-sky-fill-dbs-${{ hashFiles('data/catalogs/hyg_v42.csv.gz', 'prototype/crates/starglyph-core/src/engine.rs', 'prototype/crates/starglyph-core/src/solve.rs', 'prototype/eval/baseline-smartphone-sky-fill.json', 'prototype/Cargo.lock') }}
      - name: Test experimental gate isolation
        run: python3 -m unittest discover -s eval -p 'test_sky_fill_gate.py'
      - name: Evaluate experimental sky-fill acceptance
        run: make eval-smartphone-sky-fill-gate
      - name: Preserve experimental reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smartphone-sky-fill-eval
          path: prototype/artifacts/eval/smartphone-sky-fill/
          if-no-files-found: warn
